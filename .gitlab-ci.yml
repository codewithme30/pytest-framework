# ---------------------------------------------------------------------------
# Author  : Anil Kalisetti
# Purpose : GitLab CI pipeline. Variables (SAUCE_*, JIRA_*, ...) go in Settings > CI/CD > Variables
#           (masked + protected). Schedules: CI/CD > Schedules.
# ---------------------------------------------------------------------------
stages: [lint, offline, regression]

default:
  image: python:3.12-slim
  cache:
    key: pip-$CI_COMMIT_REF_SLUG
    paths: [.cache/pip]
  before_script:
    - export PIP_CACHE_DIR="$CI_PROJECT_DIR/.cache/pip"
    - pip install -r requirements-dev.txt

lint:
  stage: lint
  script: [ruff check ., ruff format --check ., mypy framework]

offline-tests:
  stage: offline
  script: [pytest -m "(unit or data or db) and not slow" -n auto]
  artifacts: &reports
    when: always
    expire_in: 2 weeks
    paths: [reports/]
    reports:
      junit: reports/junit.xml
      coverage_report: { coverage_format: cobertura, path: reports/coverage.xml }

api-tests:
  stage: regression
  script: [pytest -m api -n 4 --reruns 2 --reruns-delay 2]
  artifacts: *reports

ui-tests:
  stage: regression
  image: python:3.12            # full image; Chromium installed below
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  before_script:
    - apt-get update -qq && apt-get install -y -qq chromium chromium-driver
    - pip install -r requirements.txt
    - export CHROME_BINARY=/usr/bin/chromium
  script:
    - pytest -m ui -n 4 --reruns 1 --only-rerun WebDriverException --build-name "gitlab-$CI_PIPELINE_ID"
  artifacts: *reports
