# Author: Anil Kalisetti
# Install once: pre-commit install. Runs on every commit; keeps CI lint failures rare.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9            # update with: pre-commit autoupdate
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
